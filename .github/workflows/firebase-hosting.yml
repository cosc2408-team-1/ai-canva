name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy the web app
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Check the configured demo backend
        if: vars.VITE_AI_API_BASE_URL != ''
        env:
          DEMO_API_BASE_URL: ${{ vars.VITE_AI_API_BASE_URL }}
        run: |
          node <<'NODE'
          async function main() {
            const url = new URL(process.env.DEMO_API_BASE_URL);
            if (url.protocol !== 'https:' || url.username || url.password ||
                url.search || url.hash || url.pathname !== '/') {
              throw new Error('The demo API base must be an HTTPS origin.');
            }
            const response = await fetch(`${url.origin}/api/health`, {
              signal: AbortSignal.timeout(15000),
            });
            if (!response.ok) throw new Error('Demo backend health request failed.');
            const health = await response.json();
            if (health.status !== 'ok' || health.aiProvider !== 'val' || health.valKey !== 'configured') {
              throw new Error('Demo backend is not ready for VAL generation.');
            }
            console.log('Demo backend health check passed');
          }
          main().catch(() => {
            console.error('Configured demo backend health check failed; Hosting was not deployed.');
            process.exitCode = 1;
          });
          NODE

      - name: Build the client
        env:
          # Public routing configuration only; never put provider keys in VITE_*.
          VITE_AI_API_BASE_URL: ${{ vars.VITE_AI_API_BASE_URL }}
        run: npm run build --prefix client

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          channelId: live
          projectId: ai-canva-e9dff
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_CANVA_E9DFF }}
