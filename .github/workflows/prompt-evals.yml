name: Prompt evals

# Scores the security boxes' CURRENT prompts (read straight from client/src/types.ts)
# against the fixed scenarios in evals/cases.yaml. VAL generates each output and judges it.
#
# Report only: scores appear in the job summary and the report.html artifact, and never
# fail the check. The job fails only if VAL errors or an output cannot be scored.
# It is a separate workflow so a slow or unavailable VAL never blocks ci.yml.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      repeats:
        description: "How many times to run every case (1-3)"
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3"]

permissions:
  contents: read

# A new push to the same PR cancels the older eval run instead of paying for it.
concurrency:
  group: prompt-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate the current security prompts
    runs-on: ubuntu-latest
    # Three repeats are 36 outputs / ~72 sequential VAL calls (about 15 minutes).
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Node 22.18+ is needed to load client/src/types.ts without a build step.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: evals/package-lock.json

      - name: Install eval dependencies
        run: npm ci --prefix evals --ignore-scripts

      - name: Run the harness self-checks (no VAL calls)
        run: node --test evals/self-check.mjs

      - name: Validate the current prompts and cases (no VAL calls)
        run: node evals/run.mjs --app --check

      # EVAL_VAL_API_KEY keeps the eval key separate from the deploy key (VAL_API_KEY is also
      # written into the production Functions config). Fork PRs receive neither secret.
      - name: Check the VAL key is available
        id: key
        env:
          VAL_API_KEY: ${{ secrets.EVAL_VAL_API_KEY || secrets.VAL_API_KEY }}
        run: |
          if [ -z "$VAL_API_KEY" ]; then
            echo "::notice::Neither EVAL_VAL_API_KEY nor VAL_API_KEY is available to this run, so the model evaluation was skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate the current prompts with VAL
        if: steps.key.outputs.available == 'true'
        env:
          VAL_API_KEY: ${{ secrets.EVAL_VAL_API_KEY || secrets.VAL_API_KEY }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL || 'openai-gpt-5.6-terra' }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'openai-gpt-5.6-terra' }}
        run: node evals/run.mjs --app --repeats "${{ inputs.repeats || '3' }}"

      - name: Upload the report
        if: always() && steps.key.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prompt-eval-report
          path: |
            evals/report.html
            evals/.runs/
          include-hidden-files: true
          if-no-files-found: ignore
